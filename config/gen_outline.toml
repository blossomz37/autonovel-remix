[model]
temperature = 0.5
max_tokens = 16000

[prompts]
system = """
You are a novel architect with deep knowledge of Save the Cat beats,
Sanderson's plotting principles, Dan Harmon's Story Circle, and MICE Quotient.
You build outlines that an author can draft from without inventing structure
on the fly. Every chapter has beats, emotional arc, and try-fail cycle type.
You never use AI slop words. You write in clean, direct prose.
"""

user = """Build a complete chapter outline for this novel. Target: 22-26 chapters,
~80,000 words total (~3,000-4,000 words per chapter).

SEED CONCEPT:
{seed}

GENRE CONVENTIONS & THEMATIC ANCHORS:
{genre}

WORLD BIBLE:
{world}

CHARACTER REGISTRY:
{characters}

VOICE (tone and register):
{voice_part2}

CRAFT REFERENCE (structures to follow):
{craft}

BUILD THE OUTLINE WITH:

## Act Structure
Map out Act I (0-23%), Act II Part 1 (23-50%), Act II Part 2 (50-77%), Act III (77-100%).
State the percentage marks for the key novel.

## Chapter-by-Chapter Outline

For EACH chapter, provide:
### Ch N: [Title]
- **POV:** The specified point-of-view character for this chapter
- **Location:** Which districts/locations
- **Save the Cat beat:** Which beat this chapter serves (Opening Image, Setup, Catalyst, etc.)
- **% mark:** Where this falls in the novel
- **Emotional arc:** Starting emotion → ending emotion
- **Try-fail cycle:** Yes-but / No-and / No-but / Yes-and
- **Beats:** 3-5 specific scene beats that must happen
- **Plants:** Foreshadowing elements planted in this chapter
- **Payoffs:** Foreshadowing elements that pay off here
- **Character movement:** What changes for the POV character (or other characters) by chapter's end
- **The lie:** How the protagonist's core flaw or "lie" is reinforced or challenged in this chapter
- **~Word count target:** for pacing

## Foreshadowing Ledger

A table tracking every planted thread:
| Thread | Planted (Ch) | Reinforced (Ch) | Payoff (Ch) | Type |

Include at LEAST 15 threads. Types: object, dialogue, action, symbolic, structural.

KEY PLOT ARCHITECTURE:

Act I (0-23%): Establish the protagonist's world, their wound, their lie, and their status quo.
Plant the central conflicts and core thematic elements early.
Catalyst (10%): The inciting incident that forces the protagonist out of their status quo.

Act II Part 1 (23-50%): The protagonist reacts to the new world/situation. They attempt to solve problems using their old flawed logic. 
Midpoint (50%): A false victory or false defeat that shifts the protagonist from reactive to proactive, revealing a partial truth.

Act II Part 2 (50-77%): The antagonists close in. The protagonist's lie becomes increasingly unsustainable.
All Is Lost (75%): The protagonist suffers a massive defeat and learns the full truth, forcing them to face their flaw.

Act III (77-100%): The protagonist understands what must be done. They must choose how to answer the central thematic question.
The climax plays out using the established rules of the world.
The resolution shows the aftermath of their choice and the new status quo.

CONSTRAINTS:
- The climax must be mechanically resolvable using the rules established in the world lore
- The narrative should seamlessly blend the conventions defined in the genre guidelines
- The Stability Trap: bad things must stay bad. Not everything resolves cleanly.
- At least 3 chapters should be "quiet" -- character-focused, low-action, emotionally rich
- Vary the try-fail types: 60%+ should be "yes-but" or "no-and"
- The foreshadowing ledger must have plant-to-payoff distances of at least 3 chapters
"""
