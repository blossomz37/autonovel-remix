<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>autonovel-remix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-deep: #0c0f1a;
      --bg-sidebar: rgba(15, 18, 30, 0.85);
      --bg-inspector: rgba(15, 18, 30, 0.85);
      --bg-editor: rgba(10, 12, 22, 0.6);
      --glass-border: rgba(255, 255, 255, 0.06);
      --glass-border-hover: rgba(255, 255, 255, 0.12);
      --text-main: #e2e8f0;
      --text-muted: #64748b;
      --text-dim: #475569;
      --accent: #818cf8;
      --accent-soft: rgba(129, 140, 248, 0.15);
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --sidebar-w: 240px;
      --inspector-w: 280px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
      background: var(--bg-deep);
      color: var(--text-main);
    }

    /* ── App Shell ─────────────────────────── */
    .app {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr var(--inspector-w);
      grid-template-rows: 44px 1fr;
      grid-template-areas:
        "titlebar titlebar titlebar"
        "sidebar  editor   inspector";
      height: 100vh;
    }

    /* ── Title Bar ─────────────────────────── */
    .titlebar {
      grid-area: titlebar;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      background: rgba(15, 18, 30, 0.95);
      border-bottom: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.2);
      color: var(--success);
    }
    .status-pill.idle {
      background: rgba(100, 116, 139, 0.1);
      border-color: rgba(100, 116, 139, 0.2);
      color: var(--text-muted);
    }

    .pulse-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--success);
      animation: blink 1.5s infinite ease-in-out;
    }
    .status-pill.idle .pulse-dot {
      background: var(--text-muted);
      animation: none;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* ── Sidebar / File Tree ───────────────── */
    .sidebar {
      grid-area: sidebar;
      background: var(--bg-sidebar);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 0.75rem 1rem 0.5rem;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      font-weight: 600;
    }

    .file-tree {
      flex: 1;
      overflow-y: auto;
      padding: 0 0.25rem 1rem;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.08) transparent;
    }

    .tree-folder > .tree-label {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--text-muted);
      user-select: none;
      transition: background 0.15s;
    }
    .tree-folder > .tree-label:hover {
      background: rgba(255, 255, 255, 0.04);
    }
    .tree-folder > .tree-label .icon { font-size: 0.7rem; transition: transform 0.15s; }
    .tree-folder.open > .tree-label .icon { transform: rotate(90deg); }
    .tree-folder > .tree-label .folder-name { font-weight: 500; }

    .tree-children {
      display: none;
      padding-left: 0.75rem;
      border-left: 1px solid rgba(255,255,255,0.04);
      margin-left: 0.75rem;
    }
    .tree-folder.open > .tree-children { display: block; }

    .tree-file {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--text-dim);
      transition: all 0.15s;
    }
    .tree-file:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
    }
    .tree-file.active {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .tree-file .file-icon { font-size: 0.7rem; opacity: 0.5; }
    .tree-file .file-size {
      margin-left: auto;
      font-size: 0.65rem;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Editor / Preview ──────────────────── */
    .editor {
      grid-area: editor;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .editor-tabs {
      display: flex;
      align-items: center;
      background: rgba(15, 18, 30, 0.6);
      border-bottom: 1px solid var(--glass-border);
      min-height: 36px;
      padding: 0 0.5rem;
      gap: 2px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .editor-tabs::-webkit-scrollbar { display: none; }

    .editor-tab {
      padding: 6px 14px;
      font-size: 0.78rem;
      color: var(--text-dim);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      font-family: 'Outfit', sans-serif;
      transition: all 0.15s;
    }
    .editor-tab:hover { color: var(--text-muted); }
    .editor-tab.active {
      color: var(--text-main);
      border-bottom-color: var(--accent);
    }

    .preview-pane {
      flex: 1;
      overflow-y: auto;
      padding: 2rem 3rem;
      background: var(--bg-editor);
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.06) transparent;
    }
    .preview-pane::-webkit-scrollbar { width: 6px; }
    .preview-pane::-webkit-scrollbar-track { background: transparent; }
    .preview-pane::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

    .preview-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-dim);
      gap: 0.75rem;
    }
    .preview-empty .icon { font-size: 2.5rem; opacity: 0.3; }
    .preview-empty p { font-size: 0.9rem; }

    /* Markdown rendering */
    .md h1 { font-size: 1.8rem; font-weight: 600; margin: 0 0 1rem; color: #fff; border-bottom: 1px solid var(--glass-border); padding-bottom: 0.5rem; }
    .md h2 { font-size: 1.35rem; font-weight: 600; margin: 1.75rem 0 0.75rem; color: #f1f5f9; }
    .md h3 { font-size: 1.1rem; font-weight: 500; margin: 1.25rem 0 0.5rem; color: #e2e8f0; }
    .md p { margin-bottom: 0.9rem; line-height: 1.7; color: var(--text-main); }
    .md ul, .md ol { margin: 0 0 1rem 1.5rem; line-height: 1.7; }
    .md li { margin-bottom: 0.25rem; }
    .md strong { color: #fff; }
    .md em { color: #a5b4fc; }
    .md blockquote {
      border-left: 3px solid var(--accent);
      padding: 0.5rem 1rem;
      margin: 0 0 1rem;
      background: rgba(129, 140, 248, 0.05);
      border-radius: 0 8px 8px 0;
    }
    .md pre {
      background: rgba(0, 0, 0, 0.4);
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 0 0 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      line-height: 1.5;
    }
    .md code {
      background: rgba(0, 0, 0, 0.3);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82em;
    }
    .md pre code { background: none; padding: 0; }
    .md table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
    .md th, .md td { padding: 0.5rem 0.75rem; border: 1px solid var(--glass-border); font-size: 0.85rem; text-align: left; }
    .md th { background: rgba(0,0,0,0.2); color: var(--text-muted); font-weight: 500; }
    .md hr { border: none; border-top: 1px solid var(--glass-border); margin: 1.5rem 0; }

    /* ── Inspector Sidebar ─────────────────── */
    .inspector {
      grid-area: inspector;
      background: var(--bg-inspector);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-left: 1px solid var(--glass-border);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.06) transparent;
    }

    .inspector-section {
      border-bottom: 1px solid var(--glass-border);
    }

    .inspector-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }
    .inspector-header:hover { background: rgba(255, 255, 255, 0.03); }

    .inspector-header .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      font-weight: 600;
    }
    .inspector-header .chevron {
      font-size: 0.6rem;
      color: var(--text-dim);
      transition: transform 0.2s;
    }
    .inspector-section.open .inspector-header .chevron { transform: rotate(90deg); }

    .inspector-body {
      display: none;
      padding: 0 1rem 0.75rem;
    }
    .inspector-section.open .inspector-body { display: block; }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.35rem 0;
    }
    .stat-label {
      font-size: 0.78rem;
      color: var(--text-dim);
    }
    .stat-value {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
    }
    .stat-value.accent { color: var(--accent); }

    .mini-progress {
      width: 100%;
      height: 4px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 2px;
      margin-top: 0.5rem;
      overflow: hidden;
    }
    .mini-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #c084fc);
      border-radius: 2px;
      width: 0%;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .debts-list {
      list-style: none;
      margin-top: 0.25rem;
    }
    .debts-list li {
      font-size: 0.78rem;
      padding: 0.3rem 0;
      color: var(--warning);
      border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
    }
    .debts-list li::before { content: '⚠ '; }

    /* Iteration history in inspector */
    .history-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 0;
      font-size: 0.75rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
    }
    .history-row:last-child { border-bottom: none; }

    .badge {
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }
    .badge-keep { background: rgba(52, 211, 153, 0.12); color: var(--success); }
    .badge-discard { background: rgba(248, 113, 113, 0.12); color: var(--danger); }

    .history-score {
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      min-width: 2rem;
    }
    .history-desc {
      color: var(--text-dim);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Animated Blobs (Subtle) ───────────── */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      z-index: -1;
      opacity: 0.25;
      animation: float 12s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .blob-1 { top: -15%; left: -15%; width: 35vw; height: 35vw; background: rgba(99, 102, 241, 0.4); }
    .blob-2 { bottom: -15%; right: -15%; width: 40vw; height: 40vw; background: rgba(168, 85, 247, 0.25); animation-delay: -6s; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(20px, 40px) scale(1.08); }
    }

    @media (prefers-reduced-motion: reduce) {
      .blob, .pulse-dot { animation: none !important; }
    }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="app">

    <!-- Title Bar -->
    <div class="titlebar">
      <div class="titlebar-left">
        <span class="logo">autonovel-remix</span>
        <div class="status-pill" id="status-pill">
          <div class="pulse-dot" id="pulse-dot"></div>
          <span id="pipeline-status">Polling</span>
        </div>
      </div>
    </div>

    <!-- Sidebar: File Tree -->
    <aside class="sidebar">
      <div class="sidebar-header">Workspace</div>
      <div class="file-tree" id="file-tree">
        <!-- Injected by JS -->
      </div>
    </aside>

    <!-- Center: Editor / Preview -->
    <main class="editor">
      <div class="editor-tabs" id="editor-tabs">
        <!-- Tab buttons injected here -->
      </div>
      <div class="preview-pane" id="preview-pane">
        <div class="preview-empty">
          <div class="icon">📄</div>
          <p>Select a file from the sidebar to preview</p>
        </div>
      </div>
    </main>

    <!-- Right: Inspector -->
    <aside class="inspector">

      <!-- Pipeline Status -->
      <div class="inspector-section" id="sect-pipeline">
        <div class="inspector-header" onclick="toggleSection('sect-pipeline')">
          <span class="label">Pipeline</span>
          <span class="chevron">▶</span>
        </div>
        <div class="inspector-body">
          <div class="stat-row">
            <span class="stat-label">Phase</span>
            <span class="stat-value" id="val-phase" style="text-transform: capitalize;">—</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Focus</span>
            <span class="stat-value" id="val-focus">—</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Iteration</span>
            <span class="stat-value" id="val-iteration">0</span>
          </div>
        </div>
      </div>

      <!-- Scores -->
      <div class="inspector-section" id="sect-scores">
        <div class="inspector-header" onclick="toggleSection('sect-scores')">
          <span class="label">Scores</span>
          <span class="chevron">▶</span>
        </div>
        <div class="inspector-body">
          <div class="stat-row">
            <span class="stat-label">Foundation</span>
            <span class="stat-value accent" id="val-found-score">0.0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Lore</span>
            <span class="stat-value accent" id="val-lore-score">0.0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Novel</span>
            <span class="stat-value accent" id="val-novel-score">0.0</span>
          </div>
        </div>
      </div>

      <!-- Drafting Progress -->
      <div class="inspector-section" id="sect-progress">
        <div class="inspector-header" onclick="toggleSection('sect-progress')">
          <span class="label">Drafting</span>
          <span class="chevron">▶</span>
        </div>
        <div class="inspector-body">
          <div class="stat-row">
            <span class="stat-label">Chapters</span>
            <span class="stat-value"><span id="val-drafted">0</span> / <span id="val-total">0</span></span>
          </div>
          <div class="mini-progress">
            <div class="mini-progress-fill" id="progress-bar"></div>
          </div>
        </div>
      </div>

      <!-- Debts -->
      <div class="inspector-section" id="sect-debts" style="display: none;">
        <div class="inspector-header" onclick="toggleSection('sect-debts')">
          <span class="label">Debts</span>
          <span class="chevron">▶</span>
        </div>
        <div class="inspector-body">
          <ul class="debts-list" id="debts-list"></ul>
        </div>
      </div>

      <!-- Iteration History -->
      <div class="inspector-section" id="sect-history">
        <div class="inspector-header" onclick="toggleSection('sect-history')">
          <span class="label">Iterations</span>
          <span class="chevron">▶</span>
        </div>
        <div class="inspector-body" id="history-body">
          <div style="font-size: 0.75rem; color: var(--text-dim);">Awaiting data...</div>
        </div>
      </div>

    </aside>
  </div>

  <script>
    // ─── State ──────────────────────────────
    let treeData = [];
    let openTabs = [];      // [{name, path}]
    let activeTabPath = null;

    // ─── Inspector Toggle ───────────────────
    function toggleSection(id) {
      document.getElementById(id).classList.toggle('open');
    }

    // ─── File Tree ──────────────────────────
    async function fetchTree() {
      try {
        const res = await fetch('/api/tree');
        if (!res.ok) return;
        const data = await res.json();
        const key = JSON.stringify(data);
        if (key !== JSON.stringify(treeData)) {
          treeData = data;
          renderTree();
        }
      } catch (e) { console.log('tree error', e); }
    }

    function renderTree() {
      const el = document.getElementById('file-tree');
      el.innerHTML = '';
      treeData.forEach(node => el.appendChild(buildNode(node)));
    }

    function buildNode(node) {
      if (node.type === 'dir') {
        const folder = document.createElement('div');
        folder.className = 'tree-folder open';
        
        const label = document.createElement('div');
        label.className = 'tree-label';
        label.innerHTML = `<span class="icon">▶</span><span class="folder-name">${node.name}</span>`;
        label.onclick = () => folder.classList.toggle('open');
        folder.appendChild(label);

        const children = document.createElement('div');
        children.className = 'tree-children';
        (node.children || []).forEach(c => children.appendChild(buildNode(c)));
        folder.appendChild(children);
        return folder;
      } else {
        const file = document.createElement('div');
        file.className = 'tree-file' + (node.path === activeTabPath ? ' active' : '');
        const sizeStr = node.size > 1024 ? (node.size / 1024).toFixed(1) + 'k' : node.size + 'b';
        file.innerHTML = `<span class="file-icon">📄</span>${node.name}<span class="file-size">${sizeStr}</span>`;
        file.onclick = () => openFile(node.name, node.path);
        return file;
      }
    }

    // ─── Tabs & Preview ─────────────────────
    function openFile(name, path) {
      if (!openTabs.find(t => t.path === path)) {
        openTabs.push({ name, path });
      }
      activeTabPath = path;
      renderTabs();
      renderTree(); // re-highlight active
      fetchActiveFile();
    }

    function closeTab(path) {
      openTabs = openTabs.filter(t => t.path !== path);
      if (activeTabPath === path) {
        activeTabPath = openTabs.length ? openTabs[openTabs.length - 1].path : null;
      }
      renderTabs();
      renderTree();
      if (activeTabPath) {
        fetchActiveFile();
      } else {
        document.getElementById('preview-pane').innerHTML = `
          <div class="preview-empty">
            <div class="icon">📄</div>
            <p>Select a file from the sidebar to preview</p>
          </div>`;
      }
    }

    function renderTabs() {
      const bar = document.getElementById('editor-tabs');
      bar.innerHTML = '';
      openTabs.forEach(tab => {
        const btn = document.createElement('button');
        btn.className = 'editor-tab' + (tab.path === activeTabPath ? ' active' : '');
        btn.textContent = tab.name;
        btn.onclick = (e) => {
          if (e.target === btn) {
            activeTabPath = tab.path;
            renderTabs();
            renderTree();
            fetchActiveFile();
          }
        };

        // Close button
        const x = document.createElement('span');
        x.textContent = ' ✕';
        x.style.cssText = 'margin-left:6px;opacity:0.4;cursor:pointer;';
        x.onmouseover = () => x.style.opacity = '1';
        x.onmouseout = () => x.style.opacity = '0.4';
        x.onclick = (e) => { e.stopPropagation(); closeTab(tab.path); };
        btn.appendChild(x);

        bar.appendChild(btn);
      });
    }

    async function fetchActiveFile() {
      if (!activeTabPath) return;
      try {
        const res = await fetch(activeTabPath + '?t=' + Date.now());
        if (!res.ok) throw new Error('Not found');
        const text = await res.text();

        const pane = document.getElementById('preview-pane');

        // Decide render mode by extension
        if (activeTabPath.endsWith('.json')) {
          try {
            const pretty = JSON.stringify(JSON.parse(text), null, 2);
            pane.innerHTML = `<pre style="font-family:'JetBrains Mono',monospace;font-size:0.82rem;line-height:1.5;color:var(--text-main);">${escapeHtml(pretty)}</pre>`;
          } catch {
            pane.innerHTML = `<pre style="font-family:'JetBrains Mono',monospace;font-size:0.82rem;">${escapeHtml(text)}</pre>`;
          }
        } else if (activeTabPath.endsWith('.tsv')) {
          pane.innerHTML = renderTSV(text);
        } else if (activeTabPath.endsWith('.toml')) {
          pane.innerHTML = `<pre style="font-family:'JetBrains Mono',monospace;font-size:0.82rem;line-height:1.5;color:var(--text-main);">${escapeHtml(text)}</pre>`;
        } else {
          // Markdown / txt
          pane.innerHTML = `<div class="md">${marked.parse(text)}</div>`;
        }
      } catch (err) {
        document.getElementById('preview-pane').innerHTML = `<div style="padding:2rem;color:var(--danger);">Error loading file.</div>`;
      }
    }

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderTSV(text) {
      const lines = text.trim().split('\n');
      if (!lines.length) return '<p style="color:var(--text-dim)">Empty file</p>';
      let html = '<table style="width:100%;border-collapse:collapse;font-size:0.8rem;font-family:\'JetBrains Mono\',monospace;">';
      lines.forEach((line, i) => {
        const cols = line.split('\t');
        const tag = i === 0 ? 'th' : 'td';
        html += '<tr>' + cols.map(c =>
          `<${tag} style="padding:0.4rem 0.6rem;border:1px solid var(--glass-border);text-align:left;${i===0?'color:var(--text-muted);background:rgba(0,0,0,0.2);':''}">${escapeHtml(c)}</${tag}>`
        ).join('') + '</tr>';
      });
      html += '</table>';
      return html;
    }

    // ─── State / Results Polling ────────────
    async function fetchState() {
      try {
        const res = await fetch('/workspace/state.json?t=' + Date.now());
        if (!res.ok) throw new Error('err');
        const s = await res.json();

        document.getElementById('val-phase').textContent = s.phase || '—';
        document.getElementById('val-focus').textContent = s.current_focus || '—';
        document.getElementById('val-iteration').textContent = Math.max(s.iteration, s.revision_cycle) || '0';

        document.getElementById('val-found-score').textContent = (s.foundation_score || 0).toFixed(1);
        document.getElementById('val-lore-score').textContent = (s.lore_score || 0).toFixed(1);
        document.getElementById('val-novel-score').textContent = (s.novel_score || 0).toFixed(1);

        document.getElementById('val-drafted').textContent = s.chapters_drafted || '0';
        document.getElementById('val-total').textContent = s.chapters_total || '0';
        const pct = s.chapters_total > 0 ? (s.chapters_drafted / s.chapters_total * 100) : 0;
        document.getElementById('progress-bar').style.width = Math.min(pct, 100) + '%';

        // Debts
        const dp = document.getElementById('sect-debts');
        const dl = document.getElementById('debts-list');
        if (s.debts && s.debts.length) {
          dp.style.display = '';
          dl.innerHTML = '';
          s.debts.forEach(d => { const li = document.createElement('li'); li.textContent = d; dl.appendChild(li); });
        } else {
          dp.style.display = 'none';
        }

        // Status pill
        const pill = document.getElementById('status-pill');
        const statusEl = document.getElementById('pipeline-status');
        if (s.phase) {
          pill.classList.remove('idle');
          statusEl.textContent = 'Running';
        } else {
          pill.classList.add('idle');
          statusEl.textContent = 'Idle';
        }
      } catch (e) {
        document.getElementById('pipeline-status').textContent = 'Disconnected';
        document.getElementById('status-pill').classList.add('idle');
      }
    }

    async function fetchResults() {
      try {
        const res = await fetch('/workspace/results.tsv?t=' + Date.now());
        if (!res.ok) return;
        const text = await res.text();
        const lines = text.trim().split('\n');
        if (lines.length <= 1) return;

        const rows = lines.slice(1).reverse().slice(0, 8);
        const body = document.getElementById('history-body');
        body.innerHTML = '';

        rows.forEach(row => {
          const cols = row.split('\t');
          const status = cols[4] || '';
          const cls = status.includes('keep') ? 'badge-keep' : status.includes('discard') ? 'badge-discard' : '';
          const div = document.createElement('div');
          div.className = 'history-row';
          div.innerHTML = `
            <span class="badge ${cls}">${status || '—'}</span>
            <span class="history-score">${cols[2] || '—'}</span>
            <span class="history-desc" title="${escapeHtml(cols[5] || '')}">${cols[5] || ''}</span>
          `;
          body.appendChild(div);
        });
      } catch (e) { console.log('results err', e); }
    }

    // ─── Poll Loop ──────────────────────────
    setInterval(() => {
      fetchState();
      fetchResults();
      fetchTree();
      if (activeTabPath) fetchActiveFile();
    }, 2000);

    // Initial load
    fetchState();
    fetchResults();
    fetchTree();
  </script>

</body>
</html>
