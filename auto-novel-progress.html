<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>autonovel-remix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      /* Lifted from 06_repo_overview.html rainbow palette */
      --rainbow: linear-gradient(90deg, #ff3864, #ff9f1c, #ffd166, #06d6a0, #118ab2, #7c3aed, #ef476f);
      --c-rose: #ff3864;
      --c-orange: #ff9f1c;
      --c-gold: #ffd166;
      --c-emerald: #06d6a0;
      --c-teal: #118ab2;
      --c-violet: #7c3aed;
      --c-pink: #ef476f;

      /* Dark surfaces */
      --bg-deep: #0e1117;
      --bg-sidebar: rgba(14, 17, 23, 0.92);
      --bg-inspector: rgba(14, 17, 23, 0.92);
      --bg-editor: #0d1017;
      --bg-bottom: rgba(14, 17, 23, 0.92);
      --glass-border: rgba(255, 255, 255, 0.06);

      /* Text */
      --text-main: #e6edf3;
      --text-muted: #7d8590;
      --text-dim: #484f58;

      /* Accents mapped from rainbow */
      --accent: var(--c-violet);
      --accent-soft: rgba(124, 58, 237, 0.12);
      --success: var(--c-emerald);
      --warning: var(--c-gold);
      --danger: var(--c-rose);

      /* Layout */
      --sidebar-w: 240px;
      --inspector-w: 280px;
      --bottom-h: 200px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
      background: var(--bg-deep);
      color: var(--text-main);
    }

    /* ── Rainbow Top Bar ──────────────────── */
    .rainbow-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--rainbow);
      z-index: 100;
    }

    /* ── App Shell ─────────────────────────── */
    .app {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr var(--inspector-w);
      grid-template-rows: 44px 1fr var(--bottom-h);
      grid-template-areas:
        "titlebar titlebar titlebar"
        "sidebar  editor   inspector"
        "sidebar  bottom   inspector";
      height: 100vh;
      padding-top: 3px; /* account for rainbow bar */
    }

    /* ── Title Bar ─────────────────────────── */
    .titlebar {
      grid-area: titlebar;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      background: rgba(14, 17, 23, 0.96);
      border-bottom: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      background: var(--rainbow);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: rgba(6, 214, 160, 0.08);
      border: 1px solid rgba(6, 214, 160, 0.2);
      color: var(--success);
    }
    .status-pill.idle {
      background: rgba(125, 133, 144, 0.08);
      border-color: rgba(125, 133, 144, 0.2);
      color: var(--text-muted);
    }

    .pulse-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--success);
      animation: blink 1.5s infinite ease-in-out;
    }
    .status-pill.idle .pulse-dot { background: var(--text-muted); animation: none; }

    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* ── Sidebar / File Tree ───────────────── */
    .sidebar {
      grid-area: sidebar;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 0.75rem 1rem 0.5rem;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-dim);
      font-weight: 700;
      position: relative;
    }
    .sidebar-header::after {
      content: '';
      display: block;
      height: 2px;
      margin-top: 8px;
      background: var(--rainbow);
      border-radius: 2px;
      opacity: 0.5;
    }

    .file-tree {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0.25rem 1rem;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.06) transparent;
    }

    .tree-folder > .tree-label {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--text-muted);
      user-select: none;
      transition: background 0.15s;
    }
    .tree-folder > .tree-label:hover { background: rgba(255, 255, 255, 0.04); }
    .tree-folder > .tree-label .icon { font-size: 0.65rem; transition: transform 0.15s; color: var(--c-teal); }
    .tree-folder.open > .tree-label .icon { transform: rotate(90deg); }
    .tree-folder > .tree-label .folder-name { font-weight: 500; }

    .tree-children {
      display: none;
      padding-left: 0.75rem;
      border-left: 1px solid rgba(124, 58, 237, 0.15);
      margin-left: 0.75rem;
    }
    .tree-folder.open > .tree-children { display: block; }

    .tree-file {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--text-dim);
      transition: all 0.15s;
    }
    .tree-file:hover { background: rgba(255, 255, 255, 0.04); color: var(--text-muted); }
    .tree-file.active {
      background: var(--accent-soft);
      color: var(--c-violet);
    }
    .tree-file .file-icon { font-size: 0.7rem; opacity: 0.5; }
    .tree-file .file-size {
      margin-left: auto;
      font-size: 0.6rem;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Editor / Preview ──────────────────── */
    .editor {
      grid-area: editor;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-editor);
    }

    .editor-tabs {
      display: flex;
      align-items: center;
      background: rgba(14, 17, 23, 0.6);
      border-bottom: 1px solid var(--glass-border);
      min-height: 36px;
      padding: 0 0.5rem;
      gap: 2px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .editor-tabs::-webkit-scrollbar { display: none; }

    .editor-tab {
      padding: 6px 14px;
      font-size: 0.78rem;
      color: var(--text-dim);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      font-family: 'Outfit', sans-serif;
      transition: all 0.15s;
    }
    .editor-tab:hover { color: var(--text-muted); }
    .editor-tab.active {
      color: var(--text-main);
      border-bottom-color: var(--c-violet);
    }

    .preview-pane {
      flex: 1;
      overflow-y: auto;
      padding: 2rem 3rem;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.06) transparent;
    }
    .preview-pane::-webkit-scrollbar { width: 6px; }
    .preview-pane::-webkit-scrollbar-track { background: transparent; }
    .preview-pane::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }

    .preview-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-dim);
      gap: 0.75rem;
    }
    .preview-empty .icon { font-size: 2.5rem; opacity: 0.2; }
    .preview-empty p { font-size: 0.9rem; }

    /* Markdown rendering — rainbow accent touches */
    .md h1 { font-size: 1.8rem; font-weight: 700; margin: 0 0 1rem; color: #fff; border-bottom: 2px solid; border-image: var(--rainbow) 1; padding-bottom: 0.5rem; }
    .md h2 { font-size: 1.35rem; font-weight: 600; margin: 1.75rem 0 0.75rem; color: #f0f6fc; }
    .md h3 { font-size: 1.1rem; font-weight: 500; margin: 1.25rem 0 0.5rem; color: var(--text-main); }
    .md p { margin-bottom: 0.9rem; line-height: 1.7; color: var(--text-main); }
    .md ul, .md ol { margin: 0 0 1rem 1.5rem; line-height: 1.7; }
    .md li { margin-bottom: 0.25rem; }
    .md strong { color: #fff; }
    .md em { color: var(--c-emerald); }
    .md blockquote {
      border-left: 3px solid var(--c-violet);
      padding: 0.5rem 1rem;
      margin: 0 0 1rem;
      background: rgba(124, 58, 237, 0.06);
      border-radius: 0 8px 8px 0;
    }
    .md pre {
      background: rgba(0, 0, 0, 0.4);
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 0 0 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      line-height: 1.5;
      border: 1px solid var(--glass-border);
    }
    .md code {
      background: rgba(124, 58, 237, 0.1);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82em;
      color: var(--c-gold);
    }
    .md pre code { background: none; padding: 0; color: var(--text-main); }
    .md table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
    .md th, .md td { padding: 0.5rem 0.75rem; border: 1px solid var(--glass-border); font-size: 0.85rem; text-align: left; }
    .md th { background: rgba(124, 58, 237, 0.08); color: var(--text-muted); font-weight: 500; }
    .md hr { border: none; height: 2px; background: var(--rainbow); opacity: 0.3; margin: 1.5rem 0; border-radius: 1px; }

    /* ── Bottom Panel (Eval Logs) ──────────── */
    .bottom-panel {
      grid-area: bottom;
      background: var(--bg-bottom);
      border-top: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .bottom-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      min-height: 32px;
      border-bottom: 1px solid var(--glass-border);
      background: rgba(14, 17, 23, 0.6);
    }
    .bottom-tab {
      padding: 6px 12px;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      color: var(--text-dim);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      transition: all 0.15s;
    }
    .bottom-tab:hover { color: var(--text-muted); }
    .bottom-tab.active { color: var(--c-orange); border-bottom-color: var(--c-orange); }

    .bottom-content {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      line-height: 1.6;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.06) transparent;
    }

    .eval-entry {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.4rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
    }
    .eval-entry:last-child { border-bottom: none; }

    .eval-timestamp {
      color: var(--text-dim);
      white-space: nowrap;
      min-width: 7rem;
    }

    .eval-badge {
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .eval-badge-keep { background: rgba(6, 214, 160, 0.12); color: var(--c-emerald); }
    .eval-badge-discard { background: rgba(255, 56, 100, 0.12); color: var(--c-rose); }

    .eval-score {
      color: var(--c-gold);
      min-width: 2.5rem;
      text-align: right;
    }

    .eval-desc {
      color: var(--text-muted);
      flex: 1;
    }

    .resize-handle {
      height: 4px;
      cursor: ns-resize;
      background: transparent;
      position: relative;
    }
    .resize-handle:hover,
    .resize-handle.dragging {
      background: linear-gradient(90deg, var(--c-violet), var(--c-teal));
      opacity: 0.5;
    }

    /* ── Inspector Sidebar ─────────────────── */
    .inspector {
      grid-area: inspector;
      background: var(--bg-inspector);
      border-left: 1px solid var(--glass-border);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.06) transparent;
    }

    .inspector-section { border-bottom: 1px solid var(--glass-border); }

    .inspector-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 1rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
      border-left: 3px solid transparent;
    }
    .inspector-header:hover { background: rgba(255, 255, 255, 0.02); }

    /* Cycle section accent colors like the repo overview */
    .inspector-section:nth-child(6n+1) .inspector-header { border-left-color: var(--c-rose); }
    .inspector-section:nth-child(6n+2) .inspector-header { border-left-color: var(--c-orange); }
    .inspector-section:nth-child(6n+3) .inspector-header { border-left-color: var(--c-emerald); }
    .inspector-section:nth-child(6n+4) .inspector-header { border-left-color: var(--c-teal); }
    .inspector-section:nth-child(6n+5) .inspector-header { border-left-color: var(--c-violet); }
    .inspector-section:nth-child(6n+6) .inspector-header { border-left-color: var(--c-pink); }

    .inspector-header .label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      font-weight: 600;
    }
    .inspector-header .chevron {
      font-size: 0.55rem;
      color: var(--text-dim);
      transition: transform 0.2s;
    }
    .inspector-section.open .inspector-header .chevron { transform: rotate(90deg); }

    .inspector-body {
      display: none;
      padding: 0 1rem 0.75rem;
    }
    .inspector-section.open .inspector-body { display: block; }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.3rem 0;
    }
    .stat-label { font-size: 0.78rem; color: var(--text-dim); }
    .stat-value {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
    }

    .mini-progress {
      width: 100%;
      height: 4px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 2px;
      margin-top: 0.5rem;
      overflow: hidden;
    }
    .mini-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--c-emerald), var(--c-teal));
      border-radius: 2px;
      width: 0%;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .debts-list { list-style: none; margin-top: 0.25rem; }
    .debts-list li {
      font-size: 0.78rem;
      padding: 0.3rem 0;
      color: var(--c-gold);
      border-bottom: 1px dashed rgba(255, 255, 255, 0.04);
    }
    .debts-list li::before { content: '⚠ '; }

    .history-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.25rem 0;
      font-size: 0.72rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
    }
    .history-row:last-child { border-bottom: none; }

    .badge {
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 0.58rem;
      font-weight: 600;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }
    .badge-keep { background: rgba(6, 214, 160, 0.12); color: var(--c-emerald); }
    .badge-discard { background: rgba(255, 56, 100, 0.12); color: var(--c-rose); }

    .history-score { font-family: 'JetBrains Mono', monospace; color: var(--c-gold); min-width: 2rem; }
    .history-desc { color: var(--text-dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    @media (prefers-reduced-motion: reduce) {
      .pulse-dot { animation: none !important; }
    }
  </style>
</head>
<body>

  <div class="rainbow-bar"></div>

  <div class="app">

    <!-- Title Bar -->
    <div class="titlebar">
      <div class="titlebar-left">
        <span class="logo">autonovel-remix</span>
        <div class="status-pill" id="status-pill">
          <div class="pulse-dot" id="pulse-dot"></div>
          <span id="pipeline-status">Polling</span>
        </div>
      </div>
    </div>

    <!-- Sidebar: File Tree -->
    <aside class="sidebar">
      <div class="sidebar-header">Workspace</div>
      <div class="file-tree" id="file-tree"></div>
    </aside>

    <!-- Center: Editor / Preview -->
    <main class="editor">
      <div class="editor-tabs" id="editor-tabs"></div>
      <div class="preview-pane" id="preview-pane">
        <div class="preview-empty">
          <div class="icon">📄</div>
          <p>Select a file from the sidebar to preview</p>
        </div>
      </div>
    </main>

    <!-- Bottom Panel: Eval Logs -->
    <div class="bottom-panel">
      <div class="resize-handle" id="resize-handle"></div>
      <div class="bottom-header">
        <button class="bottom-tab active" id="tab-eval">Eval Logs</button>
        <button class="bottom-tab" id="tab-results">Results</button>
      </div>
      <div class="bottom-content" id="bottom-content">
        <div style="color: var(--text-dim);">Scanning eval_logs/...</div>
      </div>
    </div>

    <!-- Right: Inspector -->
    <aside class="inspector">

      <div class="inspector-section" id="sect-pipeline">
        <div class="inspector-header" onclick="toggleSection('sect-pipeline')">
          <span class="label">Pipeline</span>
          <span class="chevron">▶</span>
        </div>
        <div class="inspector-body">
          <div class="stat-row">
            <span class="stat-label">Phase</span>
            <span class="stat-value" id="val-phase" style="text-transform: capitalize;">—</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Focus</span>
            <span class="stat-value" id="val-focus">—</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Iteration</span>
            <span class="stat-value" id="val-iteration">0</span>
          </div>
        </div>
      </div>

      <div class="inspector-section" id="sect-scores">
        <div class="inspector-header" onclick="toggleSection('sect-scores')">
          <span class="label">Scores</span>
          <span class="chevron">▶</span>
        </div>
        <div class="inspector-body">
          <div class="stat-row">
            <span class="stat-label">Foundation</span>
            <span class="stat-value" id="val-found-score" style="color: var(--c-emerald);">0.0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Lore</span>
            <span class="stat-value" id="val-lore-score" style="color: var(--c-teal);">0.0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Novel</span>
            <span class="stat-value" id="val-novel-score" style="color: var(--c-violet);">0.0</span>
          </div>
        </div>
      </div>

      <div class="inspector-section" id="sect-progress">
        <div class="inspector-header" onclick="toggleSection('sect-progress')">
          <span class="label">Drafting</span>
          <span class="chevron">▶</span>
        </div>
        <div class="inspector-body">
          <div class="stat-row">
            <span class="stat-label">Chapters</span>
            <span class="stat-value"><span id="val-drafted">0</span> / <span id="val-total">0</span></span>
          </div>
          <div class="mini-progress">
            <div class="mini-progress-fill" id="progress-bar"></div>
          </div>
        </div>
      </div>

      <div class="inspector-section" id="sect-debts" style="display: none;">
        <div class="inspector-header" onclick="toggleSection('sect-debts')">
          <span class="label">Debts</span>
          <span class="chevron">▶</span>
        </div>
        <div class="inspector-body">
          <ul class="debts-list" id="debts-list"></ul>
        </div>
      </div>

      <div class="inspector-section" id="sect-history">
        <div class="inspector-header" onclick="toggleSection('sect-history')">
          <span class="label">Iterations</span>
          <span class="chevron">▶</span>
        </div>
        <div class="inspector-body" id="history-body">
          <div style="font-size: 0.72rem; color: var(--text-dim);">Awaiting data...</div>
        </div>
      </div>

    </aside>
  </div>

  <script>
    // ─── State ──────────────────────────────
    let treeData = [];
    let openTabs = [];
    let activeTabPath = null;
    let activeBottomTab = 'eval';
    let evalFiles = [];

    // ─── Inspector Toggle ───────────────────
    function toggleSection(id) {
      document.getElementById(id).classList.toggle('open');
    }

    // ─── Resize Handle ──────────────────────
    (() => {
      const handle = document.getElementById('resize-handle');
      const app = document.querySelector('.app');
      let startY, startH;
      handle.addEventListener('mousedown', e => {
        startY = e.clientY;
        startH = parseInt(getComputedStyle(app).getPropertyValue('--bottom-h'));
        handle.classList.add('dragging');
        const onMove = e2 => {
          const delta = startY - e2.clientY;
          const newH = Math.max(80, Math.min(500, startH + delta));
          app.style.setProperty('--bottom-h', newH + 'px');
        };
        const onUp = () => {
          handle.classList.remove('dragging');
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    })();

    // ─── Bottom Panel Tabs ──────────────────
    document.getElementById('tab-eval').onclick = () => { activeBottomTab = 'eval'; updateBottomTabs(); renderBottom(); };
    document.getElementById('tab-results').onclick = () => { activeBottomTab = 'results'; updateBottomTabs(); renderBottom(); };

    function updateBottomTabs() {
      document.getElementById('tab-eval').classList.toggle('active', activeBottomTab === 'eval');
      document.getElementById('tab-results').classList.toggle('active', activeBottomTab === 'results');
    }

    // ─── File Tree ──────────────────────────
    async function fetchTree() {
      try {
        const res = await fetch('/api/tree');
        if (!res.ok) return;
        const data = await res.json();
        const key = JSON.stringify(data);
        if (key !== JSON.stringify(treeData)) {
          treeData = data;
          renderTree();
        }
      } catch (e) { console.log('tree error', e); }
    }

    function renderTree() {
      const el = document.getElementById('file-tree');
      el.innerHTML = '';
      treeData.forEach(node => el.appendChild(buildNode(node)));
    }

    const folderColors = ['var(--c-violet)', 'var(--c-teal)', 'var(--c-emerald)', 'var(--c-orange)', 'var(--c-rose)', 'var(--c-gold)', 'var(--c-pink)'];
    let folderIdx = 0;

    function buildNode(node) {
      if (node.type === 'dir') {
        const color = folderColors[folderIdx++ % folderColors.length];
        const folder = document.createElement('div');
        folder.className = 'tree-folder open';
        const label = document.createElement('div');
        label.className = 'tree-label';
        label.innerHTML = `<span class="icon" style="color:${color}">▶</span><span class="folder-name">${node.name}</span>`;
        label.onclick = () => folder.classList.toggle('open');
        folder.appendChild(label);
        const children = document.createElement('div');
        children.className = 'tree-children';
        children.style.borderLeftColor = color.replace(')', ', 0.2)').replace('var(', '');
        // Simplify: just use a subtle border
        children.style.borderLeftColor = 'rgba(255,255,255,0.04)';
        (node.children || []).forEach(c => children.appendChild(buildNode(c)));
        folder.appendChild(children);
        return folder;
      } else {
        const file = document.createElement('div');
        file.className = 'tree-file' + (node.path === activeTabPath ? ' active' : '');
        const sizeStr = node.size > 1024 ? (node.size / 1024).toFixed(1) + 'k' : node.size + 'b';
        file.innerHTML = `<span class="file-icon">📄</span>${node.name}<span class="file-size">${sizeStr}</span>`;
        file.onclick = () => openFile(node.name, node.path);
        return file;
      }
    }

    // ─── Tabs & Preview ─────────────────────
    function openFile(name, path) {
      if (!openTabs.find(t => t.path === path)) openTabs.push({ name, path });
      activeTabPath = path;
      renderTabs();
      renderTree();
      fetchActiveFile();
    }

    function closeTab(path) {
      openTabs = openTabs.filter(t => t.path !== path);
      if (activeTabPath === path) activeTabPath = openTabs.length ? openTabs[openTabs.length - 1].path : null;
      renderTabs();
      renderTree();
      if (activeTabPath) fetchActiveFile();
      else document.getElementById('preview-pane').innerHTML = `<div class="preview-empty"><div class="icon">📄</div><p>Select a file from the sidebar to preview</p></div>`;
    }

    function renderTabs() {
      const bar = document.getElementById('editor-tabs');
      bar.innerHTML = '';
      openTabs.forEach(tab => {
        const btn = document.createElement('button');
        btn.className = 'editor-tab' + (tab.path === activeTabPath ? ' active' : '');
        btn.textContent = tab.name;
        btn.onclick = (e) => { if (e.target === btn) { activeTabPath = tab.path; renderTabs(); renderTree(); fetchActiveFile(); } };
        const x = document.createElement('span');
        x.textContent = ' ✕';
        x.style.cssText = 'margin-left:6px;opacity:0.3;cursor:pointer;';
        x.onmouseover = () => x.style.opacity = '1';
        x.onmouseout = () => x.style.opacity = '0.3';
        x.onclick = (e) => { e.stopPropagation(); closeTab(tab.path); };
        btn.appendChild(x);
        bar.appendChild(btn);
      });
    }

    async function fetchActiveFile() {
      if (!activeTabPath) return;
      try {
        const res = await fetch(activeTabPath + '?t=' + Date.now());
        if (!res.ok) throw new Error('Not found');
        const text = await res.text();
        const pane = document.getElementById('preview-pane');
        if (activeTabPath.endsWith('.json')) {
          try { pane.innerHTML = `<pre style="font-family:'JetBrains Mono',monospace;font-size:0.82rem;line-height:1.5;color:var(--text-main);">${escapeHtml(JSON.stringify(JSON.parse(text), null, 2))}</pre>`; }
          catch { pane.innerHTML = `<pre style="font-family:'JetBrains Mono',monospace;font-size:0.82rem;">${escapeHtml(text)}</pre>`; }
        } else if (activeTabPath.endsWith('.tsv')) {
          pane.innerHTML = renderTSV(text);
        } else if (activeTabPath.endsWith('.toml')) {
          pane.innerHTML = `<pre style="font-family:'JetBrains Mono',monospace;font-size:0.82rem;line-height:1.5;color:var(--text-main);">${escapeHtml(text)}</pre>`;
        } else {
          pane.innerHTML = `<div class="md">${marked.parse(text)}</div>`;
        }
      } catch (err) {
        document.getElementById('preview-pane').innerHTML = `<div style="padding:2rem;color:var(--danger);">Error loading file.</div>`;
      }
    }

    function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function renderTSV(text) {
      const lines = text.trim().split('\n');
      if (!lines.length) return '<p style="color:var(--text-dim)">Empty file</p>';
      let html = '<table style="width:100%;border-collapse:collapse;font-size:0.8rem;font-family:\'JetBrains Mono\',monospace;">';
      lines.forEach((line, i) => {
        const cols = line.split('\t');
        const tag = i === 0 ? 'th' : 'td';
        html += '<tr>' + cols.map(c =>
          `<${tag} style="padding:0.4rem 0.6rem;border:1px solid var(--glass-border);text-align:left;${i===0?'color:var(--text-muted);background:rgba(124,58,237,0.06);':''}">${escapeHtml(c)}</${tag}>`
        ).join('') + '</tr>';
      });
      return html + '</table>';
    }

    // ─── Bottom Panel: Eval Logs & Results ──
    async function fetchEvalLogs() {
      try {
        const res = await fetch('/api/tree');
        if (!res.ok) return;
        const tree = await res.json();
        const evalDir = tree.find(n => n.name === 'eval_logs');
        if (evalDir && evalDir.children) {
          evalFiles = evalDir.children
            .filter(f => f.name.endsWith('.json'))
            .sort((a, b) => b.name.localeCompare(a.name))
            .slice(0, 15);
        }
        if (activeBottomTab === 'eval') renderBottom();
      } catch (e) { console.log('eval fetch err', e); }
    }

    let cachedResultsTSV = '';
    async function fetchResultsTSV() {
      try {
        const res = await fetch('/workspace/results.tsv?t=' + Date.now());
        if (!res.ok) return;
        cachedResultsTSV = await res.text();
        if (activeBottomTab === 'results') renderBottom();
      } catch (e) {}
    }

    function renderBottom() {
      const el = document.getElementById('bottom-content');
      if (activeBottomTab === 'eval') {
        if (!evalFiles.length) {
          el.innerHTML = '<div style="color:var(--text-dim);">No eval logs found yet.</div>';
          return;
        }
        el.innerHTML = evalFiles.map(f => {
          // Parse timestamp from filename: 20260531_140455_foundation.json
          const parts = f.name.replace('.json', '').split('_');
          const ts = parts.length >= 2 ? `${parts[0].slice(0,4)}-${parts[0].slice(4,6)}-${parts[0].slice(6,8)} ${parts[1].slice(0,2)}:${parts[1].slice(2,4)}:${parts[1].slice(4,6)}` : f.name;
          const phase = parts.length >= 3 ? parts.slice(2).join('_') : '';
          return `<div class="eval-entry">
            <span class="eval-timestamp">${ts}</span>
            <span class="eval-badge eval-badge-keep" style="background:rgba(124,58,237,0.1);color:var(--c-violet);">${phase}</span>
            <span class="eval-desc" style="cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;" onclick="openFile('${f.name}', '${f.path}')">${f.name}</span>
          </div>`;
        }).join('');
      } else {
        // Results TSV
        const lines = cachedResultsTSV.trim().split('\n');
        if (lines.length <= 1) { el.innerHTML = '<div style="color:var(--text-dim);">No results yet.</div>'; return; }
        const rows = lines.slice(1).reverse().slice(0, 15);
        el.innerHTML = rows.map(row => {
          const cols = row.split('\t');
          const status = cols[4] || '';
          const cls = status.includes('keep') ? 'eval-badge-keep' : status.includes('discard') ? 'eval-badge-discard' : '';
          return `<div class="eval-entry">
            <span class="eval-badge ${cls}">${status || '—'}</span>
            <span class="eval-score">${cols[2] || '—'}</span>
            <span class="eval-desc">${cols[5] || ''}</span>
          </div>`;
        }).join('');
      }
    }

    // ─── State Polling ──────────────────────
    async function fetchState() {
      try {
        const res = await fetch('/workspace/state.json?t=' + Date.now());
        if (!res.ok) throw new Error('err');
        const s = await res.json();
        document.getElementById('val-phase').textContent = s.phase || '—';
        document.getElementById('val-focus').textContent = s.current_focus || '—';
        document.getElementById('val-iteration').textContent = Math.max(s.iteration, s.revision_cycle) || '0';
        document.getElementById('val-found-score').textContent = (s.foundation_score || 0).toFixed(1);
        document.getElementById('val-lore-score').textContent = (s.lore_score || 0).toFixed(1);
        document.getElementById('val-novel-score').textContent = (s.novel_score || 0).toFixed(1);
        document.getElementById('val-drafted').textContent = s.chapters_drafted || '0';
        document.getElementById('val-total').textContent = s.chapters_total || '0';
        const pct = s.chapters_total > 0 ? (s.chapters_drafted / s.chapters_total * 100) : 0;
        document.getElementById('progress-bar').style.width = Math.min(pct, 100) + '%';
        const dp = document.getElementById('sect-debts');
        const dl = document.getElementById('debts-list');
        if (s.debts && s.debts.length) { dp.style.display = ''; dl.innerHTML = ''; s.debts.forEach(d => { const li = document.createElement('li'); li.textContent = d; dl.appendChild(li); }); }
        else { dp.style.display = 'none'; }
        const pill = document.getElementById('status-pill');
        const statusEl = document.getElementById('pipeline-status');
        if (s.phase) { pill.classList.remove('idle'); statusEl.textContent = 'Running'; }
        else { pill.classList.add('idle'); statusEl.textContent = 'Idle'; }
      } catch (e) { document.getElementById('pipeline-status').textContent = 'Disconnected'; document.getElementById('status-pill').classList.add('idle'); }
    }

    async function fetchResults() {
      try {
        const res = await fetch('/workspace/results.tsv?t=' + Date.now());
        if (!res.ok) return;
        const text = await res.text();
        cachedResultsTSV = text;
        const lines = text.trim().split('\n');
        if (lines.length <= 1) return;
        const rows = lines.slice(1).reverse().slice(0, 8);
        const body = document.getElementById('history-body');
        body.innerHTML = '';
        rows.forEach(row => {
          const cols = row.split('\t');
          const status = cols[4] || '';
          const cls = status.includes('keep') ? 'badge-keep' : status.includes('discard') ? 'badge-discard' : '';
          const div = document.createElement('div');
          div.className = 'history-row';
          div.innerHTML = `<span class="badge ${cls}">${status || '—'}</span><span class="history-score">${cols[2] || '—'}</span><span class="history-desc" title="${escapeHtml(cols[5] || '')}">${cols[5] || ''}</span>`;
          body.appendChild(div);
        });
      } catch (e) {}
    }

    // ─── Poll Loop ──────────────────────────
    setInterval(() => {
      fetchState();
      fetchResults();
      fetchTree();
      fetchEvalLogs();
      fetchResultsTSV();
      if (activeTabPath) fetchActiveFile();
    }, 2500);

    // Initial load
    fetchState();
    fetchResults();
    fetchTree();
    fetchEvalLogs();
  </script>

</body>
</html>
